<svg width="280" height="70" viewBox="0 0 280 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sphere Radial Gradient -->
    <radialGradient id="mub-sphere-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#087BFF" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#713BFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020817" stop-opacity="0" />
    </radialGradient>

    <!-- M Gradient -->
    <linearGradient id="mub-m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="45%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>

    <!-- Dev Gradient -->
    <linearGradient id="mub-dev-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>

    <!-- Orbital Gradient -->
    <linearGradient id="mub-orbit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="60%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="mub-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mub-sphere-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (X: 6 to 66, Y: 5 to 65) ==================== -->
  <g transform="translate(4, 5)">
    <!-- Glowing Blue/Violet Core Sphere -->
    <circle cx="30" cy="30" r="24" fill="url(#mub-sphere-grad)" filter="url(#mub-sphere-blur)" />

    <!-- Orbital Ring (Back segment) -->
    <path
      d="M 10 39 A 26 10 32 0 1 50 21"
      fill="none"
      stroke="url(#mub-orbit-grad)"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.55"
    />

    <!-- Left Coding Bracket '<' in Neon Cyan -->
    <path
      d="M 17 21 L 9 30 L 17 39"
      fill="none"
      stroke="#00D9FF"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#mub-neon-glow)"
    />
    <path
      d="M 17 21 L 9 30 L 17 39"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Right Coding Bracket '>' in Neon Violet -->
    <path
      d="M 43 21 L 51 30 L 43 39"
      fill="none"
      stroke="#713BFF"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#mub-neon-glow)"
    />
    <path
      d="M 43 21 L 51 30 L 43 39"
      fill="none"
      stroke="#E0D0FF"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Stylized Geometric 'M' Emblem -->
    <path
      d="M 19 39 L 19 22 L 30 33 L 41 22 L 41 39"
      fill="none"
      stroke="url(#mub-m-grad)"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#mub-neon-glow)"
    />
    <!-- Gloss Highlight Line on M -->
    <path
      d="M 19 39 L 19 22 L 30 33 L 41 22 L 41 39"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.75"
    />

    <!-- Orbital Ring (Front segment) -->
    <path
      d="M 50 21 A 26 10 32 0 1 10 39"
      fill="none"
      stroke="url(#mub-orbit-grad)"
      stroke-width="2.4"
      stroke-linecap="round"
      filter="url(#mub-neon-glow)"
    />
    <!-- Orbiting Energy Particle -->
    <circle cx="15" cy="37" r="1.8" fill="#00D9FF" filter="url(#mub-neon-glow)" />
    <circle cx="15" cy="37" r="0.9" fill="#FFFFFF" />
  </g>

  <!-- ==================== WORDMARK ==================== -->
  <g transform="translate(74, 38)">
    <text font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="0.5">
      <tspan fill="#F5F8FF">Mub</tspan>
      <tspan fill="url(#mub-dev-grad)" filter="url(#mub-neon-glow)">dev</tspan>
    </text>
  </g>

  <!-- ==================== TAGLINE ==================== -->
  <g transform="translate(75, 54)">
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="500" font-size="7.5" fill="#94A3B8" letter-spacing="2">
      ENGINEER <tspan fill="#00D9FF">•</tspan> CREATE <tspan fill="#713BFF">•</tspan> INNOVATE
    </text>
  </g>
</svg>

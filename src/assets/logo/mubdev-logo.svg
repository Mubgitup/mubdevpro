<svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Emblem -->
  <g transform="translate(4, 5) scale(0.5)">
    <polygon points="20,82 20,28 50,56 80,28 80,82 66,82 66,50 50,65 34,50 34,82" fill="none" stroke="url(#logo-emblem-grad)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" filter="url(#logo-glow)" />
    <polygon points="50,30 55,38 50,46 45,38" fill="#00D9FF" />
    <circle cx="20" cy="28" r="4" fill="#00D9FF" />
    <circle cx="80" cy="28" r="4" fill="#713BFF" />
  </g>
  <!-- Text -->
  <text x="65" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#F5F8FF" letter-spacing="1">MUB<tspan fill="#00D9FF" filter="url(#logo-glow)">DEV</tspan></text>
</svg>

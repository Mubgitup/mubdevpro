version: '3.8'

services:
  # MySQL Relational Database Service
  db:
    image: mysql:8.0
    container_name: mubdev_mysql
    restart: always
    environment:
      MYSQL_DATABASE: mubdev_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-StrongProductionPassword2026!}
      MYSQL_USER: ${DB_USER:-mubdev_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-StrongProductionPassword2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Python Django Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: mubdev_backend
    restart: always
    command: gunicorn mubdev_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,mubdev.com}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: mubdev_db
      DB_USER: ${DB_USER:-mubdev_user}
      DB_PASSWORD: ${DB_PASSWORD:-StrongProductionPassword2026!}
      DB_HOST: db
      DB_PORT: 3306
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mubdev.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"

  # Nginx Reverse Proxy & React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mubdev_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - static_volume:/usr/share/nginx/html/static

volumes:
  mysql_data:
  static_volume:


<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fav-sphere-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#087BFF" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#713BFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020817" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fav-m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="45%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>
    <linearGradient id="fav-orbit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="100" height="100" rx="22" fill="#020817" />
  <rect width="100" height="100" rx="22" stroke="rgba(0, 217, 255, 0.35)" stroke-width="1.5" />

  <!-- Glowing Core Sphere -->
  <circle cx="50" cy="50" r="34" fill="url(#fav-sphere-grad)" />

  <!-- Orbital Ring (Back segment) -->
  <path
    d="M 20 64 A 40 16 32 0 1 80 36"
    fill="none"
    stroke="url(#fav-orbit-grad)"
    stroke-width="2.6"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Left Bracket '<' -->
  <path
    d="M 30 35 L 18 50 L 30 65"
    fill="none"
    stroke="#00D9FF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#fav-glow)"
  />
  <path
    d="M 30 35 L 18 50 L 30 65"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Right Bracket '>' -->
  <path
    d="M 70 35 L 82 50 L 70 65"
    fill="none"
    stroke="#713BFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#fav-glow)"
  />
  <path
    d="M 70 35 L 82 50 L 70 65"
    fill="none"
    stroke="#E0D0FF"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Stylized M Emblem -->
  <path
    d="M 33 65 L 33 37 L 50 54 L 67 37 L 67 65"
    fill="none"
    stroke="url(#fav-m-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#fav-glow)"
  />
  <!-- Gloss Line on M -->
  <path
    d="M 33 65 L 33 37 L 50 54 L 67 37 L 67 65"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.8"
  />

  <!-- Orbital Ring (Front segment) -->
  <path
    d="M 80 36 A 40 16 32 0 1 20 64"
    fill="none"
    stroke="url(#fav-orbit-grad)"
    stroke-width="3.6"
    stroke-linecap="round"
    filter="url(#fav-glow)"
  />
  <!-- Orbiting Node -->
  <circle cx="26" cy="61" r="3" fill="#00D9FF" filter="url(#fav-glow)" />
  <circle cx="26" cy="61" r="1.5" fill="#FFFFFF" />
</svg>
